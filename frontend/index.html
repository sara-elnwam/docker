<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل حضور الطلاب</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; width: 70%; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; text-align: right; }
        li { background: #eee; margin: 5px 0; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>سجل حضور الطلاب</h2>
        <input type="text" id="studentName" placeholder="اكتب اسم الطالب هنا...">
        <button onclick="addStudent()">إضافة</button>
        <hr>
        <h3>الطلاب المسجلين:</h3>
        <ul id="studentList"></ul>
    </div>

    <script>
        // دالة لجلب وعرض الأسماء
        async function loadStudents() {
            const res = await fetch('/api/students');
            const students = await res.json();
            const list = document.getElementById('studentList');
            list.innerHTML = students.map(s => `<li>${s.name}</li>`).join('');
        }

        // دالة لإضافة اسم جديد
        async function addStudent() {
            const name = document.getElementById('studentName').value;
            if (!name) return;
            await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            document.getElementById('studentName').value = '';
            loadStudents();
        }

        loadStudents(); // تحميل الأسماء أول ما الصفحة تفتح
    </script>
</body>
</html>
