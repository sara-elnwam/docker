<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع الـ Full Stack</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 5px; }
        #response { margin-top: 20px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مشروع الـ Full Stack المعتمد على Docker</h1>
        <p>اضغط على الزر للتأكد من الربط مع الـ Backend وقاعدة البيانات:</p>
        
        <button onclick="fetchData()">اختبار الاتصال</button>
        
        <div id="response">في انتظار ضغط الزر...</div>
    </div>

    <script>
        async function fetchData() {
            const responseDiv = document.getElementById('response');
            responseDiv.innerText = "جاري الاتصال...";
            
            try {
                // بنبعت الطلب للـ Nginx وهو بيوصله للـ Backend
                const response = await fetch('/api/data');
                const data = await response.json();
                responseDiv.innerText = data.message;
            } catch (error) {
                responseDiv.innerText = "خطأ في الاتصال! تأكد من تشغيل الـ Containers.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
